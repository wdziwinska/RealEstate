[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-agents"
version = "0.1.0"
description = "MVP multi-agent system for selecting residential real estate in Poland."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Codex" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "streamlit>=1.40",
  "chromadb>=0.5.20",
  "pypdf>=5.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
